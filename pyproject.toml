[project]
name = "sag2poc-evalkit"
version = "0.1.0"
description = "Retrieval metrics (R@k, AE@k, paired bootstrap) and dataset loaders for SAG2POC"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["evalkit"]
